name: CI

# Tests before merge, in parallel (CTO decision 2026-09-26). The tag build (build_and_release.yml) no longer runs
# the suites: it requires a green `CI` run (push to main) for the tagged commit instead.
#   backend-tests   4 shards of tests/unit + tests/integration (scripts/ci/shard_tests.py, deterministic split)
#   frontend-tests  flutter test (perf tag skipped by dart_test.yaml) + flutter analyze (errors only)
#   ci-ok           single required status check for branch protection
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned by full commit SHA; the comment names the release.
jobs:
  backend-tests:
    name: Backend tests (shard ${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pydantic[email]" email-validator pytest pytest-asyncio pyyaml

      - name: Run Backend Tests (shard ${{ matrix.shard }}/4)
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t files < <(python scripts/ci/shard_tests.py --shards 4 --index "$SHARD")
          echo "Shard $SHARD/4: ${#files[@]} test files"
          python -m pytest "${files[@]}" -W ignore --junitxml="pytest-shard-$SHARD.xml"

      - name: Upload JUnit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-shard-${{ matrix.shard }}
          path: pytest-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
          retention-days: 14

  frontend-tests:
    name: Frontend tests + analyze
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          flutter pub get

      - name: Flutter Analyze (errors only)
        working-directory: ./frontend
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter Test
        working-directory: ./frontend
        run: |
          flutter test -j 2

  ci-ok:
    name: ci-ok
    if: always()
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: All CI Jobs Passed
        env:
          BACKEND: ${{ needs.backend-tests.result }}
          FRONTEND: ${{ needs.frontend-tests.result }}
        run: |
          echo "backend-tests=$BACKEND frontend-tests=$FRONTEND"
          [[ "$BACKEND" == "success" && "$FRONTEND" == "success" ]] || { echo "::error::CI failed"; exit 1; }
