name: PR Checks

# Guardrail for every Pull Request into main, whoever (or whatever AI agent) wrote it.
# - backend-gate + flutter-analyze run on every PR push and are the checks the owner requires before merging.
# - Full suites live in full_tests.yml (label `full-tests` or manual run), so a label event can never cancel or skip
#   these checks. The release gate stays local (scripts/release/run_release_tests.py, /release-check).
# Uses `pull_request` (never `pull_request_target`) and a read-only token: PR code never sees a secret.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-gate:
    name: Backend gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Boot check, single Alembic head, append-only history, guard tests + tests of the touched modules.
      - name: Guardrails PR gate
        run: python scripts/ci/guardrails.py pr-gate --base origin/${{ github.base_ref || 'main' }}

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        # Installed with git, not subosito/flutter-action: that action calls actions/cache@v5 by tag,
        # which the org allow-list (full-SHA pinning) rejects even with cache disabled.
        shell: bash
        run: |
          git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Get packages
        working-directory: ./frontend
        run: flutter pub get

      # Compile errors fail the PR; warnings and infos are reported but do not block.
      - name: Analyze
        working-directory: ./frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Backend <-> Flutter contract: every message / enum code in docs/*.json must exist in the Dart
      # catalogs. A backend-only code addition passes analyze but breaks these on main (seen with BE67-T02).
      - name: Contract parity tests
        working-directory: ./frontend
        run: flutter test test/system_message_catalog_parity_test.dart test/enum_codes_parity_test.dart
