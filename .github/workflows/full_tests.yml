name: Full Tests

# Full backend (~40 min) and Flutter (~16 min) suites on demand: add the label `full-tests` to a PR (re-runs on every
# push while the label stays), or run this workflow manually. Separate from pr_checks.yml so a label event can never
# cancel or skip the required "Backend gate" / "Flutter analyze" checks.
# Uses `pull_request` (never `pull_request_target`) and a read-only token: PR code never sees a secret.

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A label other than `full-tests` gets its own group, so it never cancels a running full suite.
  group: full-tests-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'full-tests') && github.run_id || 'suite' }}
  cancel-in-progress: true

jobs:
  backend-full:
    name: Backend full suite (on demand)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-tests') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'full-tests'))
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Full pytest
        shell: pwsh
        env:
          SECRET_KEY: ci-full-suite-secret-key-not-for-production
          ALLOW_DEV_AUTH_BYPASS: 'false'
        run: |
          $env:DATABASE_PATH = Join-Path $env:RUNNER_TEMP 'ci_full.db'
          python -m pytest -q -p no:cacheprovider --junitxml="$env:RUNNER_TEMP/junit.xml"
          $code = $LASTEXITCODE
          python scripts/ci/guardrails.py junit-summary "$env:RUNNER_TEMP/junit.xml"
          exit $code

  flutter-full:
    name: Flutter full suite (on demand)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-tests') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'full-tests'))
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: false  # flutter-action's internal actions/cache@v5 is not SHA-pinned; org allow-list rejects it

      - name: Flutter test
        working-directory: ./frontend
        run: |
          flutter pub get
          flutter test -j 2 --timeout 120s
