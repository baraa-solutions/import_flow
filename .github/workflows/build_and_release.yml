name: Build & Release Sorour Logistics

on:
  # Releases are cut from version tags only (plan C2); a push to main no longer publishes anything.
  push:
    tags:
      - 'v*'
  # Manual build (no GitHub Release unless dispatched on a tag). Publishing to the update host is a separate,
  # manual workflow: publish_update.yml ("Publish update"). This workflow holds no publish secrets.
  workflow_dispatch:

# Least privilege: every job is read-only unless it says otherwise (only `release` writes).
permissions:
  contents: read

# Third-party actions are pinned by full commit SHA (plan section 4.3); the comment names the release.
jobs:
  build-and-release:
    name: Build & Release Windows Standalone & Installer
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      build: ${{ steps.get_version.outputs.build }}

    steps:
      # No test suites here: they run locally before tagging (scripts/release/run_release_tests.py, checked by
      # /release-check). GitHub only builds and publishes.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pydantic[email]" email-validator pyinstaller

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: true

      - name: Enable Windows Desktop Support
        run: |
          flutter config --enable-windows-desktop

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          flutter pub get

      - name: Build Standalone Backend Executable (backend.exe)
        run: |
          python build_backend_exe.py

      - name: Build Flutter Windows Desktop Release
        working-directory: ./frontend
        run: |
          flutter build windows --release

      # Production DB safety (plan section 0, R1/R4): nothing below may ship a database, .env, key,
      # backups/updates folder or a destructive maintenance script.
      - name: Bundle Guard (Installer Script)
        run: |
          python scripts/release/bundle_guard.py --iss installer/importflow_setup.iss

      # Inno Setup is installed only AFTER this step, so package_production.py stages the bundle and
      # the portable zip without compiling the installer; the installer is built below, after the guard.
      - name: Package Standalone Portable Bundle
        run: |
          python package_production.py --no-bump

      - name: Bundle Guard (Staged Bundle & Portable Zip)
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem -Path dist/releases -Filter "Sorour_Logistics_*_Windows_Portable.zip")
          if ($zips.Count -eq 0) { Write-Error "Portable zip not found in dist/releases"; exit 1 }
          $zipArgs = @(); foreach ($z in $zips) { $zipArgs += @("--zip", $z.FullName) }
          python scripts/release/bundle_guard.py --iss installer/importflow_setup.iss --dir dist/Sorour_Logistics_Standalone @zipArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress -y

      - name: Build Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\importflow_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read Current Version
        id: get_version
        shell: pwsh
        run: |
          $versionJson = Get-Content -Raw -Path version.json | ConvertFrom-Json
          $ver = $versionJson.version
          $build = $versionJson.build_number
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "APP_BUILD=$build" >> $env:GITHUB_ENV
          Write-Output "TAG_NAME=v$ver" >> $env:GITHUB_ENV
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Output "build=$build" >> $env:GITHUB_OUTPUT
          Write-Host "Prepared release tag: v$ver (Build $build)"

      # Unsigned manifest payload (plan 4.3): size + sha256 of the installer, release notes, alembic head.
      # Publish-time choices (mandatory, min_supported_version, expires_days) are inputs of publish_update.yml;
      # the private key never reaches this workflow.
      - name: Build Unsigned Update Manifest
        shell: pwsh
        run: |
          $exe = "dist/releases/Sorour_Logistics_Setup_v$env:APP_VERSION.exe"
          if (-not (Test-Path $exe)) { Write-Error "Installer not found: $exe"; exit 1 }
          $notesAr = "docs/release_notes/$env:APP_VERSION.ar.txt"
          $notesEn = "docs/release_notes/$env:APP_VERSION.en.txt"
          foreach ($n in @($notesAr, $notesEn)) {
            if (-not (Test-Path $n)) { Write-Error "Release notes missing: $n (one note per line)"; exit 1 }
          }
          $head = python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; print(ScriptDirectory.from_config(Config('alembic.ini')).get_current_head() or '')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifestArgs = @('--installer', $exe, '--version', $env:APP_VERSION, '--build', $env:APP_BUILD,
                            '--notes-ar', $notesAr, '--notes-en', $notesEn,
                            '--out', 'dist/update/manifest.unsigned.json')
          if ($head) { $manifestArgs += @('--db-schema-revision', $head.Trim()) }
          python scripts/release/build_manifest.py @manifestArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Build Artifacts (Fallback)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Sorour_Logistics_${{ env.TAG_NAME }}_Build_${{ env.APP_BUILD }}
          path: |
            dist/releases/*
            version.json

      # Input of publish_update.yml (downloaded from this run by run id): one installer + the unsigned payload.
      # Kept 30 days: publish any time within a month of the tag build.
      - name: Upload Update Payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-payload
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/releases/Sorour_Logistics_Setup_v${{ env.APP_VERSION }}.exe
            dist/update/manifest.unsigned.json

  # The only job with write access: creates the GitHub Release from the build artifact. It checks out nothing
  # and runs no project code. Tag runs only: a manual dispatch from a branch creates no GitHub Release.
  release:
    name: GitHub Release
    needs: build-and-release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: v${{ needs.build-and-release.outputs.version }}
      APP_BUILD: ${{ needs.build-and-release.outputs.build }}

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Sorour_Logistics_v${{ needs.build-and-release.outputs.version }}_Build_${{ needs.build-and-release.outputs.build }}
          path: release-assets

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: "Sorour Logistics ERP ${{ env.TAG_NAME }} (Build ${{ env.APP_BUILD }})"
          body: |
            ## 🚀 Sorour Logistics ERP ${{ env.TAG_NAME }} (Build ${{ env.APP_BUILD }})

            ### 📦 Release Assets & Downloads
            - **Setup Installer:** `Sorour_Logistics_Setup_${{ env.TAG_NAME }}.exe`
            - **Portable Zip:** `Sorour_Logistics_${{ env.TAG_NAME }}_Windows_Portable.zip`
            - **Version Manifest:** `version.json`

            ### 🛡️ Safe In-Place Auto-Update
            This release contains the standalone zero-dependency distribution with embedded Python backend and SQLite schema auto-migration.
          files: |
            release-assets/dist/releases/Sorour_Logistics_Setup_*.exe
            release-assets/dist/releases/Sorour_Logistics_*_Windows_Portable.zip
            release-assets/version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
